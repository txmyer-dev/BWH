steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
substitutions:
  _REGION: us-central1
  _REPOSITORY: legacy-studio
  _SERVICE: legacy-studio
options:
  logging: CLOUD_LOGGING_ONLY
